name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      # Without this, the default (true) means one matrix leg failing cancels the
      # other — a macOS-only failure would cancel the Linux job before it ever ran,
      # which directly contradicts the comment below: ubuntu-latest exists so a
      # Linux-only regression does not pass uncaught, and it cannot do that if a
      # failure on the other leg is allowed to cancel it first.
      fail-fast: false
      matrix:
        # macos-latest catches macOS-specific regressions this project actually cares
        # about (it's the maintainer's own platform); ubuntu-latest is here because
        # syscall.Stat_t and unix sockets build on Linux too, and macOS runners cost
        # roughly ten times as much — a Linux-only regression would otherwise go
        # uncaught for free.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: setup-go
        with:
          go-version-file: go.mod
      # install-mode: goinstall (rather than the default binary download) with
      # GOTOOLCHAIN pinned to the exact toolchain setup-go just installed, because
      # golangci-lint's own official release binaries are currently built with an older
      # Go toolchain than this module's go.mod requires, and golangci-lint refuses to
      # analyse code targeting a newer Go language version than it was itself built
      # with. Building from source against the same toolchain go.mod requires avoids
      # that mismatch, without hardcoding the version separately from go.mod.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOTOOLCHAIN: go${{ steps.setup-go.outputs.go-version }}
        with:
          version: v2.13.2
          install-mode: goinstall
          install-only: true
      - run: go mod verify
      # govulncheck is a CI tool, not a module dependency — installed via `go install`
      # with an exact pinned version, the same way golangci-lint's version is pinned
      # above, rather than `@latest`, so a new advisory in a newer govulncheck release
      # cannot change what this job reports without a deliberate version bump here.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - run: make lint
      - run: make test
      - run: make build
      - run: make verify-ldflags

  web-tests:
    # The frontend has no build step and no dependencies, so this needs node and
    # nothing else — not the Go toolchain, and not both operating systems the
    # `check` matrix covers: these tests exercise pure ES modules against a stubbed
    # fetch and a stub document, and nothing in them can be platform-specific.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: make test-web

  docs-parity:
    # A documentation check has no reason to run on both operating systems the
    # `check` job matrix covers, and needs no Go toolchain at all.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check every English doc has a Russian counterpart with the same heading sequence
        run: |
          # The pairing is derived, not hardcoded: every docs/en/*.md must have a
          # docs/ru/<same name>.md counterpart, plus the explicit README.md /
          # README.ru.md pair (README lives outside docs/, so it cannot be
          # discovered by the same glob). A new English page with no Russian
          # translation must fail here, by name, instead of passing silently.
          #
          # Pairs are compared by the *sequence* of heading levels (#, ##, ###,
          # ...), not by how many headings each page has: two pages can hold an
          # equal count while their structure has drifted apart, and comparing
          # the sequence catches that as well as a dropped section. Fenced code
          # blocks (a line whose trimmed form starts with three backticks or
          # three tildes, up to the matching closing fence) are skipped, since a
          # naive `grep -c '^#'` would also count shell comments and example
          # headings quoted inside a fence — the gap that once forced
          # docs/en/board-convention.md to indent its example card's headings
          # just to dodge the count, which made the documented card not shaped
          # like a real one.
          heading_sequence() {
            awk '
              /^[[:space:]]*(```|~~~)/ { fence = !fence; next }
              fence { next }
              match($0, /^#{1,6}[[:space:]]/) { print RLENGTH - 1 }
            ' "$1"
          }

          check_pair() {
            en="$1"
            ru="$2"
            if [ ! -f "$ru" ]; then
              echo "missing translation: $ru has no counterpart for $en"
              mismatch=1
              return 0
            fi
            en_seq=()
            while IFS= read -r lvl; do en_seq+=("$lvl"); done < <(heading_sequence "$en")
            ru_seq=()
            while IFS= read -r lvl; do ru_seq+=("$lvl"); done < <(heading_sequence "$ru")
            max=${#en_seq[@]}
            if [ "${#ru_seq[@]}" -gt "$max" ]; then
              max=${#ru_seq[@]}
            fi
            i=0
            while [ "$i" -lt "$max" ]; do
              a="${en_seq[$i]:-<missing heading>}"
              b="${ru_seq[$i]:-<missing heading>}"
              if [ "$a" != "$b" ]; then
                echo "heading sequence mismatch: $en vs $ru diverge at heading #$((i + 1)) (English level $a, Russian level $b)"
                mismatch=1
                return 0
              fi
              i=$((i + 1))
            done
            return 0
          }

          mismatch=0
          check_pair README.md README.ru.md

          shopt -s nullglob
          en_docs=(docs/en/*.md)
          if [ "${#en_docs[@]}" -eq 0 ]; then
            echo "docs/en contains no markdown files: this check would pass vacuously"
            exit 1
          fi
          for en in "${en_docs[@]}"; do
            check_pair "$en" "docs/ru/$(basename "$en")"
          done

          exit "$mismatch"

  oldest-macos-app:
    # Builds the app the way the release does, on the release's own runner, for
    # window-on-oldest-macos to open on an older macOS. It is built here and not
    # there: clang builds for the macOS it runs on unless told otherwise, so a bundle
    # built on the older runner opens on it whether or not the build names the
    # minimum, and that run would pass for a release that still breaks. macOS runners
    # cost roughly ten times what Linux does; nothing cheaper can see this defect.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Unsigned and under the stand identifier: nothing built here is published, and
      # nothing opened from it may pass for the app.
      - name: Build the app the way the release does
        run: make dist-app VERSION=v0.0.0-ci DISTDIR=dist SIGN_IDENTITY= BUNDLE_ID=dev.fleetdeck.stand
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oldest-macos-app
          path: dist/fleetdeck-v0.0.0-ci-macos.zip
          if-no-files-found: error
          retention-days: 3

  window-on-oldest-macos:
    # Opens that app on the oldest macOS GitHub still runs, 15, next to v0.9.1's,
    # whose window was built for macOS 26. macOS 13's runners were retired in
    # December 2025 and macOS 14's are being retired (brownouts from 2026-07-06, gone
    # on 2026-11-02), so neither can hold a check that has to stay green. Below 15
    # nothing is measured: docs/engineering/release-app.md, "The oldest macOS".
    #
    # Only this build decides the job. v0.9.1 is measured beside it and recorded as
    # it comes: a first run of this job found its window loads on macOS 15.7.9, so
    # nothing here may assume it fails. Its stand never reports "panel" either way:
    # v0.9.1's window logs no page state, and knows nothing of FLEETDECK_STAND_SOCKET,
    # which is harmless on a runner with no fleet daemon and nowhere else.
    needs: oldest-macos-app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oldest-macos-app
          path: new
      - name: Unpack this build and v0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -x -k new/fleetdeck-v0.0.0-ci-macos.zip new
          gh release download v0.9.1 --repo "$GITHUB_REPOSITORY" --pattern fleetdeck-v0.9.1-macos.zip --dir old
          ditto -x -k old/fleetdeck-v0.9.1-macos.zip old
      - name: Show the macOS and what each build was built for
        run: |
          sw_vers
          for app in new/fleetdeck.app old/fleetdeck.app; do
            echo "=== $app, LSMinimumSystemVersion $(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")"
            for b in fleetdeck fleetdeck-status fleetdeck-window; do
              xcrun vtool -show-build "$app/Contents/MacOS/$b"
            done
            # What a newer build target links that an older macOS may not have:
            # libc++'s std::bad_function_call, marked in the SDK as introduced in
            # macOS 15.4, imported by a window built for 26.
            echo "--- $app window, libc++ bad_function_call imports:"
            nm -m -u "$app/Contents/MacOS/fleetdeck-window" | grep bad_function_call || echo "(none)"
          done
      # A window that gets as far as printing its flags has been loaded and has run
      # its main.
      - name: Each window loads
        run: |
          mkdir -p out
          for app in new old; do
            status=0
            "$app/fleetdeck.app/Contents/MacOS/fleetdeck-window" -h > "out/$app-load.log" 2>&1 || status=$?
            echo "=== $app: exit status $status"
            cat "out/$app-load.log"
          done
          grep -q 'Usage of' out/new-load.log
      # With a fleet's page, so the glass frame comes up: on macOS 15 there is no
      # NSGlassEffectView, and the frame's panels are NSVisualEffectView.
      - name: This build's window, started directly, shows the panel's page in its frame
        run: scripts/ci-window-stand.sh new/fleetdeck.app 7791 out/new-exec exec frame
      - name: v0.9.1's window, started directly, as it comes
        run: scripts/ci-window-stand.sh old/fleetdeck.app 7792 out/old-exec exec || echo "=== v0.9.1, started directly, did not reach the panel's page"
      # LaunchServices is what Finder goes through, and it reads LSMinimumSystemVersion.
      # Measured, not asserted: whether a runner's LaunchServices opens a window at all
      # is itself something to find out.
      - name: Both windows, opened through LaunchServices, as they come
        run: |
          scripts/ci-window-stand.sh new/fleetdeck.app 7793 out/new-open open frame || echo "=== this build, opened, did not reach the panel's page in its frame"
          scripts/ci-window-stand.sh old/fleetdeck.app 7794 out/old-open open || echo "=== v0.9.1, opened, did not reach the panel's page"
      - name: What LaunchServices does with a bundle that asks for macOS 26
        run: |
          mkdir -p gate out/gate
          ditto new/fleetdeck.app gate/fleetdeck.app
          plutil -replace LSMinimumSystemVersion -string 26.0 gate/fleetdeck.app/Contents/Info.plist
          codesign --force --deep --sign - gate/fleetdeck.app
          status=0
          open -n -g --stderr "$PWD/out/gate/window.log" gate/fleetdeck.app --args -h > out/gate/open.log 2>&1 || status=$?
          sleep 5
          echo "open exit status: $status"
          cat out/gate/open.log
          echo "--- window output"
          cat out/gate/window.log 2>/dev/null || echo "(none: the window did not run)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: window-on-oldest-macos
          path: out
          if-no-files-found: ignore
          retention-days: 7

  window-on-macos-26:
    # Opens the same app on the macOS its glass is for. v0.10.0 went out with its
    # window seen whole only on macOS 15, where the frame is NSVisualEffectView; on
    # the operator's macOS 26 it could not be dragged and its capsules could not be
    # read. The glass tests of `check` run on macos-latest, which moves; they run
    # here too, on the named release, next to the window's screenshot.
    needs: oldest-macos-app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oldest-macos-app
          path: new
      - name: Unpack this build
        run: ditto -x -k new/fleetdeck-v0.0.0-ci-macos.zip new
      - name: Show the macOS and the screen
        run: |
          sw_vers
          system_profiler SPDisplaysDataType | grep --extended-regexp 'Resolution|UI Looks like' || true
      # With reduced transparency or increased contrast the window draws its
      # frame and capsules opaque, not in glass (currentGlassMode), and a stand
      # then shows nothing of the glass. What the runner has, and both turned off
      # for the stands; the step after the tests puts them back.
      - name: The runner's transparency and contrast, turned off for the stands
        run: |
          for key in reduceTransparency increaseContrast; do
            was=$(defaults read com.apple.universalaccess "$key" 2>/dev/null || echo unset)
            echo "$key $was" >>"$RUNNER_TEMP/universalaccess-before"
            defaults write com.apple.universalaccess "$key" -bool false || echo "=== $key could not be written"
            echo "=== $key: was $was, now $(defaults read com.apple.universalaccess "$key" 2>/dev/null || echo unset)"
          done
      # The window's gate, before the tests. After them, on this runner, the
      # panel the window started did not answer in 330 ms in 3 runs of 3, while
      # before them it did in 2 of 2, and a panel started without a window
      # right after them answered in 53 ms (run 34850302115). The window is
      # sized to the runner's 1024x768 screen, so both panels are in the
      # screenshot, and drawn light and then dark: the operator uses dark. The
      # dark screenshot proves the capsules' colour and that none lies over
      # another; it does not prove the text under the glass is sharp, since this
      # runner draws v0.10.0's capsules without the blur the operator's Mac
      # showed (run 34854756877).
      #
      # The frame is shown with content (scripts/standdaemon): a card in every
      # stage, more long-named sessions than the sessions panel shows, one
      # waiting and one stopped, and an orchestrator terminal with long lines
      # and a status line. An empty frame hid what the operator saw broken in
      # v0.10.0's panels. The last frame has the new card form open.
      - name: This build's window in its frame, light
        env:
          FLEETDECK_STAND_WINDOW_SIZE: 1000x700
          FLEETDECK_STAND_APPEARANCE: light
          FLEETDECK_STAND_CAPSULES: glass
        run: scripts/ci-window-stand.sh new/fleetdeck.app 7795 out/light exec content
      - name: This build's window in its frame, dark
        env:
          FLEETDECK_STAND_WINDOW_SIZE: 1000x700
          FLEETDECK_STAND_APPEARANCE: dark
          FLEETDECK_STAND_CAPSULES: glass
          FLEETDECK_STAND_SYSTEM: light
        run: scripts/ci-window-stand.sh new/fleetdeck.app 7797 out/dark exec content
      - name: This build's window in its frame, dark, with the new card form open
        env:
          FLEETDECK_STAND_WINDOW_SIZE: 1000x700
          FLEETDECK_STAND_APPEARANCE: dark
          FLEETDECK_STAND_OPEN: newcard
        run: scripts/ci-window-stand.sh new/fleetdeck.app 7799 out/dark-newcard exec content
      # The capsules take the theme chosen in fleetdeck, whatever the system's
      # (capsules_darwin.c). With a theme other than the system's they were dark
      # on dark or light on light on glass (run 34868250061), and white on white
      # when opaque (runs 34863293838 and 34864709919). The operator's system is
      # dark, and a light theme is one press of the theme capsule away. The dark
      # stand above is glass with the system light and the app dark; these are
      # glass with the system dark and the app light, then opaque, with reduced
      # transparency, both ways. Each fails unless the window's log says the
      # capsules are drawn in that material and the app's appearance: that is the
      # wiring, not that the capsules can be read, which their screenshots show.
      # Each also fails unless the window found the system in the mode set here
      # (FLEETDECK_STAND_SYSTEM): glass menus and the Dock show the wallpaper, so
      # a screenshot cannot say, and `defaults` says only what was written.
      - name: This build's window in its frame, glass, the system dark and the app light
        env:
          FLEETDECK_STAND_WINDOW_SIZE: 1000x700
          FLEETDECK_STAND_APPEARANCE: light
          FLEETDECK_STAND_CAPSULES: glass
          FLEETDECK_STAND_SYSTEM: dark
        run: |
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          echo "=== System Events says dark mode: $(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode')"
          scripts/ci-window-stand.sh new/fleetdeck.app 7801 out/glass-system-dark-app-light exec content
      - name: This build's window in its frame, opaque, the system dark and the app light
        env:
          FLEETDECK_STAND_WINDOW_SIZE: 1000x700
          FLEETDECK_STAND_APPEARANCE: light
          FLEETDECK_STAND_CAPSULES: opaque
          FLEETDECK_STAND_SYSTEM: dark
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool true
          echo "=== reduceTransparency: $(defaults read com.apple.universalaccess reduceTransparency 2>/dev/null || echo unset)"
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          echo "=== System Events says dark mode: $(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode')"
          scripts/ci-window-stand.sh new/fleetdeck.app 7803 out/opaque-system-dark-app-light exec content
      - name: This build's window in its frame, opaque, the system light and the app dark
        env:
          FLEETDECK_STAND_WINDOW_SIZE: 1000x700
          FLEETDECK_STAND_APPEARANCE: dark
          FLEETDECK_STAND_CAPSULES: opaque
          FLEETDECK_STAND_SYSTEM: light
        run: |
          defaults write com.apple.universalaccess reduceTransparency -bool true
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false'
          echo "=== System Events says dark mode: $(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode')"
          scripts/ci-window-stand.sh new/fleetdeck.app 7805 out/opaque-system-light-app-dark exec content
      - name: The system light again
        if: always()
        run: osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to false' || true
      # The frame on hidden windows: glass, the capsules inside it, the drag band.
      - name: The window's tests on macOS 26
        run: go test -count=1 ./cmd/fleetdeck-window/
      - name: The runner's transparency and contrast as they were
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/universalaccess-before" ] || exit 0
          while read -r key was; do
            case $was in
              unset) defaults delete com.apple.universalaccess "$key" 2>/dev/null || true ;;
              1) defaults write com.apple.universalaccess "$key" -bool true || true ;;
              *) defaults write com.apple.universalaccess "$key" -bool false || true ;;
            esac
          done <"$RUNNER_TEMP/universalaccess-before"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: window-on-macos-26
          path: out
          if-no-files-found: ignore
          retention-days: 7
